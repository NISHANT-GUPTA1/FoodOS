#   food_cost_per_portion            sum over recipe lines of (qty_kg / prep_yield) * unit_cost_per_kg
#   contribution_margin_per_portion  price - food_cost_per_portion - labour_cost_per_portion
#   input_kg_per_portion             as-purchased kilograms consumed, the basis of the externality term
#   co2e_kg_per_portion              as-purchased kilograms * co2e_kg_per_kg
#   disposal_cost_per_portion        what it costs to bin one unsold portion
#
