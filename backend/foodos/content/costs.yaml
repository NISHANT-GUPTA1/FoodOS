# FoodOS — cost, price and carbon master
# Owner: Person D
#
# WARNING: every rupee figure the demo shows is derived from this file. A wrong number here
# is a wrong number on stage. tests/test_agents/test_content.py recomputes every derived
# field from recipes.yaml + yield_table.yaml and fails the build on a mismatch.
#
# Units
#   unit_cost_per_kg          INR per kilogram, as-purchased, landed wholesale
#   co2e_kg_per_kg            kg CO2e per kg of ingredient, cradle-to-kitchen-door
#   disposal_cost_per_kg      INR per kg to actually get the waste out of the building
#
# Prices are inclusive of nothing — they are menu list price, pre-tax, pre-aggregator
# commission. aggregator_commission_pct is applied by the engine per channel, not here.
#
# co2e sources: Poore & Nemecek (2018) global means, adjusted for Indian supply chains
# (shorter cold chain, higher paddy methane, open-field rather than greenhouse produce).
# Prices: Indian metro wholesale, 2025 season averages. Deliberately mid-season, not a
# spike, so the demo does not depend on a freak onion price.

version: 1
currency: INR
labour_cost_per_portion: 12.00 # marginal labour of producing one more portion, not allocated overhead
disposal_default_per_kg: 8.00

# --- the lambda price basis -------------------------------------------------
# lambda is the sustainability weight, 0 to 1, that the operator sets on the Plan screen.
# The engine multiplies lambda by the sustainability cost of an action:
#
#   sustainability_cost(a) = co2e_price_per_kg * co2e(a) + waste_externality_per_kg_food * kg_food(a)
#   V(a) = margin(a) - holding(a) - disposal(a) - lambda * sustainability_cost(a)
#
# Why two terms and not just carbon: at any defensible carbon price, carbon alone is
# rounding error next to an Indian restaurant's contribution margin. Priced honestly it
# would not move the plan at all, and a slider that does nothing is worse than no slider.
# The externality term is the rest of the damage — land, water, nutrient loss, landfill
# methane — which is where the real cost of wasted food sits.
#
# co2e_price_per_kg: India CCTS / EU ETS range, taken at the low end.
# waste_externality_per_kg_food: FAO "Food Wastage Footprint: Full-Cost Accounting" puts
#   the full societal cost of food wastage near USD 2 per kg (~INR 170). We use INR 45,
#   roughly a quarter of that, so the demo is arguing from a conservative figure rather
#   than a flattering one. Raising it makes our case look better, which is why we did not.
lambda_price:
  co2e_price_per_kg: 4.50
  waste_externality_per_kg_food: 45.00

