# FoodOS — recipe bill of materials
# Owner: Person D
#
# 14 dishes. One standard portion each. Quantities are PREPPED (edible) weight in kg.
# The engine divides by prep_yield from yield_table.yaml to get the purchase quantity,
# which is how a plan in dishes becomes a purchase list in kilograms.
#
#   line qty_kg      -> what ends up in the pan
#   qty_kg / yield   -> what has to be bought
#
# Quantities are per ONE portion. A plan of 63 portions multiplies every line by 63.
#
# station: which prep station owns the mise-en-place. Used by the Planner agent to group
# a rescue menu into work that one person can actually execute in one shift.
# prep_ahead_hours: how far ahead this dish's mise-en-place is normally cut. This is the
# number that turns a forecast miss into cut-vegetable waste rather than whole-vegetable
# inventory, and it is why gobi_manchurian is pathology one.

