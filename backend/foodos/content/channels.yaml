# FoodOS — recovery channels
# Owner: Person D
#
# The RECOVER action space. Every channel here is an action the optimiser can take on
# stock that PREVENT failed to avoid and PRESERVE cannot save.
#
# recovery_factor
#   Fraction of the unit value basis that actually comes back as cash or avoided cost.
#   basis: menu_price   -> finished, saleable portions
#   basis: food_cost    -> raw or prepped ingredient, valued at what we paid
#   recovered_value = qty * unit_value(basis) * recovery_factor
#
#   These are NET of the channel's own cost — commission, packing, transport, staff time.
#   A channel that recovers 65% of menu price but pays 22% commission is entered at 0.43,
#   not 0.65. Judges will ask. The answer is in this file.
#
# THE FEASIBILITY GATE
#   A channel is eligible only if ALL of:
#     rsl_hours_remaining >= lead_time_hours + min_residual_life_hours
#     batch.state       in states
#     batch.category    in allowed_categories  (or allowed_categories is 'any')
#     qty               >= min_qty_kg  and (max_qty_kg is null or qty <= max_qty_kg)
#     day_of_week       in available_days
#     hour_of_day       within cutoff_hour
#     every flag in requires  is true for the batch
#
#   The gate runs BEFORE ranking. Failing channels are returned to the UI with
#   exclusion_reason populated and are rendered greyed out, never dropped. An operator
#   who watches an option vanish without explanation stops trusting the system, and a
#   judge who sees only the winning option assumes we cherry-picked it.

version: 1

exclusion_reasons:
  lead_time_exceeds_rsl: Not enough shelf life left to reach this channel in time
  state_not_accepted: This channel does not accept stock in this state
  category_not_accepted: This channel does not accept this product category
  below_min_qty: Below this channel's minimum pickup quantity
  above_max_qty: Above what this channel can absorb today
  day_unavailable: This channel does not operate today
  past_cutoff: Past today's cutoff time for this channel
  missing_requirement: A required condition is not met
  cold_chain_unavailable: No cold chain available for the transfer
  licence_restriction: Food safety rules do not permit this route for this stock

channels:
  - id: dine_in_special
    name: Same-day menu special
    type: own_demand
    horizon: RECOVER
    basis: menu_price
    recovery_factor: 0.72 # 20% discount, no commission, small covers uplift
    lead_time_hours: 0.5
    min_residual_life_hours: 3
    min_qty_kg: 0.0
    max_qty_kg: 12.0
    states: [prepped, cooked, raw]
    allowed_categories: any
    available_days: [mon, tue, wed, thu, fri, sat, sun]
    cutoff_hour: 20
    requires: []
    co2e_avoided_factor: 1.0
    notes: >
      Highest recovery and zero logistics, but capacity is bounded by tonight's covers.
      The optimiser must not dump 40 kg here just because the rate is best.

  - id: app_flash_deal
    name: Delivery app flash deal
    type: aggregator
    horizon: RECOVER
    basis: menu_price
    recovery_factor: 0.43 # 65% list price less 22% aggregator commission and packing
    lead_time_hours: 2
    min_residual_life_hours: 4
    min_qty_kg: 1.0
    max_qty_kg: 25.0
    states: [cooked, prepped]
    allowed_categories: any
    available_days: [mon, tue, wed, thu, fri, sat, sun]
    cutoff_hour: 22
    requires: [menu_listed]
    co2e_avoided_factor: 1.0
    notes: Reaches demand we do not otherwise have. Commission is the whole reason it ranks below the in-house special.

  - id: b2b_transfer
    name: Transfer to sister outlet
    type: internal_transfer
    horizon: RECOVER
    basis: food_cost
    recovery_factor: 0.90 # full value less transport and handling; it is our own stock
    lead_time_hours: 6
    min_residual_life_hours: 12
    min_qty_kg: 2.0
    max_qty_kg: null
    states: [raw, prepped]
    allowed_categories:
      [
        vegetable,
        dairy,
        poultry,
        red_meat,
        seafood,
        dry_goods,
        frozen,
        cut_vegetable,
      ]
    available_days: [mon, tue, wed, thu, fri, sat]
    cutoff_hour: 16
    requires: [cold_chain_available]
    co2e_avoided_factor: 1.0
    notes: >
      The best rupee outcome for raw stock, and the reason the Communicator agent exists —
      somebody has to send the other outlet's manager a message they will actually act on.

  - id: surplus_marketplace
    name: Surplus marketplace listing
    type: marketplace
    horizon: RECOVER
    basis: menu_price
    recovery_factor: 0.31
    lead_time_hours: 4
    min_residual_life_hours: 6
    min_qty_kg: 1.5
    max_qty_kg: 30.0
    states: [cooked, prepped]
    allowed_categories: any
    available_days: [mon, tue, wed, thu, fri, sat, sun]
    cutoff_hour: 19
    requires: []
    co2e_avoided_factor: 1.0

  - id: staff_meal
    name: Staff meal
    type: cost_avoidance
    horizon: RECOVER
    basis: food_cost
    recovery_factor: 0.55 # avoided staff-meal ingredient spend, not revenue
    lead_time_hours: 0.5
    min_residual_life_hours: 2
    min_qty_kg: 0.0
    max_qty_kg: 6.0
    states: [cooked, prepped, raw]
    allowed_categories: any
    available_days: [mon, tue, wed, thu, fri, sat, sun]
    cutoff_hour: 23
    requires: []
    co2e_avoided_factor: 1.0
    notes: Small ceiling. Real, but it cannot absorb a service-sized error.

  - id: ngo_donation
    name: NGO / food bank donation
    type: donation
    horizon: RECOVER
    basis: food_cost
    recovery_factor: 0.18 # 80G tax relief and avoided disposal, not revenue
    lead_time_hours: 12
    min_residual_life_hours: 18
    min_qty_kg: 5.0
    max_qty_kg: null
    states: [raw, prepped]
    allowed_categories: [vegetable, dry_goods, dairy, frozen]
    available_days: [mon, wed, fri]
    cutoff_hour: 15
    requires: [cold_chain_available, unopened_packaging]
    co2e_avoided_factor: 1.0
    notes: >
      Deliberately excludes cooked food. FSSAI surplus-food guidance treats cooked
      donations as high risk once out of temperature control, and a food-safety
      incident is not a rounding error on a saving. The system will refuse this route
      for cooked stock and will say why.

  - id: animal_feed
    name: Animal feed collection
    type: downcycle
    horizon: RECOVER
    basis: food_cost
    recovery_factor: 0.04
    lead_time_hours: 24
    min_residual_life_hours: 0
    min_qty_kg: 10.0
    max_qty_kg: null
    states: [raw, prepped, trim]
    allowed_categories: [vegetable, dry_goods]
    available_days: [tue, thu, sat]
    cutoff_hour: 11
    requires: [no_meat_contact]
    co2e_avoided_factor: 0.6

  - id: compost
    name: Compost / biogas
    type: downcycle
    horizon: RECOVER
    basis: food_cost
    recovery_factor: 0.01
    lead_time_hours: 24
    min_residual_life_hours: 0
    min_qty_kg: 0.0
    max_qty_kg: null
    states: [raw, prepped, cooked, trim, spoiled]
    allowed_categories: any
    available_days: [mon, tue, wed, thu, fri, sat, sun]
    cutoff_hour: 23
    requires: []
    co2e_avoided_factor: 0.35
    notes: Avoids landfill methane, recovers almost no money. Still beats the bin.

  - id: disposal
    name: Disposal
    type: baseline
    horizon: RECOVER
    basis: food_cost
    recovery_factor: 0.0
    lead_time_hours: 0
    min_residual_life_hours: 0
    min_qty_kg: 0.0
    max_qty_kg: null
    states: [raw, prepped, cooked, trim, spoiled]
    allowed_categories: any
    available_days: [mon, tue, wed, thu, fri, sat, sun]
    cutoff_hour: 24
    requires: []
    co2e_avoided_factor: 0.0
    is_baseline: true
    notes: >
      Always eligible, always ranked last, never hidden. It is the counterfactual every
      other channel is measured against — the saving we claim is (channel - disposal),
      not the channel's gross value.

# --- PRESERVE actions -------------------------------------------------------
# Not channels. Interventions that BUY SHELF LIFE rather than move stock, so the
# optimiser can compare "save it" against "sell it cheap" on the same axis.
#
# life_multiplier here is a FALLBACK, used only for ranking when the batch's zone
# temperature is unknown. When the zone temperature is known — which it is for every batch
# in the demo — the RSL model in shelf_life.yaml supersedes it, because the true gain from
# moving a batch depends on the Q10 of its category and the actual temperature gap, not on
# a single constant. Expect the engine's figure and this constant to differ; the engine's
# is the one to show.
preserve_actions:
  - id: rezone_to_colder
    name: Move to the walk-in chiller
    life_multiplier: 1.8
    cost: 0
    lead_time_hours: 0.25
    applies_to_states: [raw, prepped]
    notes: Free. The engine should recommend this before anything that costs margin.

  - id: separate_ethylene
    name: Separate from ethylene producers
    life_multiplier: 1.43 # undoes the 0.70 ethylene penalty
    cost: 0
    lead_time_hours: 0.25
    applies_to_states: [raw]
    requires: [ethylene_sensitive]

  - id: blanch_and_chill
    name: Blanch and chill
    life_multiplier: 2.2
    cost_per_kg: 14
    lead_time_hours: 1
    applies_to_states: [raw, prepped]
    allowed_categories: [vegetable]

  - id: cook_to_base
    name: Cook down to a gravy base
    life_multiplier: 2.5
    cost_per_kg: 22
    lead_time_hours: 2
    applies_to_states: [raw, prepped]
    notes: Turns a dying vegetable into a two-day asset. This is what the Planner drafts a special around.

  - id: blast_freeze
    name: Blast freeze
    life_multiplier: 20.0
    cost_per_kg: 9
    lead_time_hours: 1.5
    applies_to_states: [raw, prepped, cooked]
    requires: [freeze_tolerant]
    notes: Enormous life gain, but quality-limited. Never offer it for leafy greens or fresh paneer.

# ============================================================================
# AGRI DIVERSION COUNTERPARTIES â€” the RECOVER action space for the farm-gate node
# ============================================================================
# Owner: Person D. Added for the agri batch product; the kitchen node above is unchanged.
#
# WHY THIS IS A SEPARATE KEY AND NOT MORE ROWS UNDER `channels:`
#   `ingest/channels.py` reads `channels:` and maps each row onto a `ChannelType` by its
#   id. An agri id is not in that map, so its `type:` string would reach the ORM as an
#   invalid enum value and break `python -m foodos.ingest.seed` â€” the one command that
#   runs fifty times before the demo and must never break. Seeding these rows into the
#   kitchen org would also change the kitchen node's rescue results and the regression
#   suite that proves the platform claim. Additive block, zero risk, and B reads it
#   through `content.agri_channels()`.
#
# WHAT A DIVERSION IS HERE
#   A consignment whose RUL will not survive its planned journey. PREVENT (leave earlier,
#   tarp it) and PRESERVE (reroute, split) have already been scored and lost. These are
#   the routes that recover something rather than nothing â€” the agri equivalent of the
#   kitchen's markdown ladder, priced off the mandi rate instead of a menu price.
#
#   basis: mandi_price   -> fraction of the destination modal price actually realised
#   basis: farm_gate     -> fraction of the origin-market price
#   basis: cost          -> avoided cost only; no revenue
#
#   recovery_factor is NET of the counterparty's own deductions â€” commission, weighment,
#   loading, their transport if they do not collect. A processor quoting Rs 6/kg against
#   a Rs 19.50 modal rate is entered at 0.31, not at some gross number with a footnote.
#
#   engine_channel_type is the `ChannelType` B constructs the Action with, stated here so
#   the mapping is content, not a guess in engine code.
#
# Sources: processing rates are 2025-26 Karnataka tomato paste-line procurement (process
# grade is bought on soluble solids, not appearance, which is why heavy visual damage
# barely moves it); institutional and aggregator rates are Bengaluru B2B produce buyers'
# published B-grade bands; feed and compost are the Kolar dairy co-op and district
# horticulture department vermicompost rates.

agri_channels:
  - id: divert_secondary_mandi
    name: Divert to the nearest terminal mandi
    type: reroute
    engine_channel_type: b2b_transfer
    horizon: RECOVER
    basis: mandi_price
    recovery_factor: 0.88 # that mandi's own modal rate, less its commission and fees
    lead_time_hours: 2.0
    min_residual_life_hours: 6
    min_qty_kg: 500
    max_qty_kg: null
    allowed_grades: [A, B_plus, B, C]
    available_days: [mon, tue, wed, thu, fri, sat, sun]
    cutoff_hour: 20
    requires: [vehicle_en_route]
    co2e_avoided_factor: 1.0
    notes: >
      The first thing to try and the least dramatic. Priced at the *destination's* modal
      rate, which is why it reads as a loss against Delhi and still as a large gain
      against arriving with unsaleable fruit. Absorption caps in mandis.yaml apply.

  - id: tomato_processing_line
    name: Tomato paste / puree line
    type: processing
    engine_channel_type: processing
    horizon: RECOVER
    basis: mandi_price
    recovery_factor: 0.31 # ~Rs 6/kg process-grade against a Rs 19.50 modal rate
    lead_time_hours: 8.0
    min_residual_life_hours: 10
    min_qty_kg: 2000 # a paste line will not open for a part load
    max_qty_kg: 25000
    allowed_grades: [A, B_plus, B, C]
    available_days: [mon, tue, wed, thu, fri, sat]
    cutoff_hour: 16
    requires: [no_rot]
    distance_km: 95
    co2e_avoided_factor: 1.0
    notes: >
      The route that does not care what the fruit looks like. Process grade is bought on
      soluble solids and colour, so heavy bruising costs almost nothing here while it
      costs a full grade band at a fresh market. That inversion is the single most
      counter-intuitive thing the engine knows, and it is worth saying on stage.

  - id: institutional_bulk
    name: Institutional bulk buyer (canteen / mid-day meal contractor)
    type: own_demand
    engine_channel_type: b2b_transfer
    horizon: RECOVER
    basis: farm_gate
    recovery_factor: 0.74
    lead_time_hours: 12.0
    min_residual_life_hours: 24
    min_qty_kg: 1000
    max_qty_kg: 6000
    allowed_grades: [A, B_plus, B]
    available_days: [mon, tue, wed, thu, fri]
    cutoff_hour: 14
    requires: [no_rot, fssai_traceable]
    co2e_avoided_factor: 1.0
    notes: >
      Good rate, real volume, and a 24-hour residual-life bar that a batch already in
      trouble usually fails. Kept because it is exactly the option an operator will ask
      about, and the answer should be a reason, not a shrug.

  - id: b2b_produce_aggregator
    name: B2B produce aggregator (B-grade lot)
    type: aggregator
    engine_channel_type: b2b_transfer
    horizon: RECOVER
    basis: farm_gate
    recovery_factor: 0.58 # B-grade band, less the aggregator's grading rejection allowance
    lead_time_hours: 6.0
    min_residual_life_hours: 18
    min_qty_kg: 500
    max_qty_kg: 8000
    allowed_grades: [B_plus, B]
    available_days: [mon, tue, wed, thu, fri, sat]
    cutoff_hour: 17
    co2e_avoided_factor: 1.0

  - id: roadside_distress_sale
    name: Roadside / highway trader lot sale
    type: distress
    engine_channel_type: markdown
    horizon: RECOVER
    basis: farm_gate
    recovery_factor: 0.34 # what a trader pays for a load that visibly cannot wait
    lead_time_hours: 1.0
    min_residual_life_hours: 2
    min_qty_kg: 200
    max_qty_kg: 4000
    allowed_grades: [A, B_plus, B, C]
    available_days: [mon, tue, wed, thu, fri, sat, sun]
    cutoff_hour: 22
    co2e_avoided_factor: 1.0
    notes: >
      What actually happens today when a load runs out of time, and therefore a route the
      system must be able to price rather than moralise about. Ranking it honestly is how
      the engine earns the right to say when it is the best remaining option.

  - id: agri_ngo_donation
    name: NGO / community kitchen donation
    type: donation
    engine_channel_type: donation
    horizon: RECOVER
    basis: cost
    recovery_factor: 0.06 # avoided disposal and haulage only; the social value is separate
    social_value_per_kg: 22.0
    lead_time_hours: 6.0
    min_residual_life_hours: 12
    min_qty_kg: 200
    max_qty_kg: 3000
    allowed_grades: [A, B_plus, B]
    available_days: [mon, tue, wed, thu, fri, sat]
    cutoff_hour: 15
    requires: [no_rot]
    co2e_avoided_factor: 1.0
    notes: >
      Cash recovery is close to zero by design â€” the value is credited through
      social_value_per_kg and the mu weight, not smuggled into the revenue term. A
      donation that looks like a 6% cash sale is a donation nobody will trust.

  - id: dairy_coop_feed
    name: Dairy co-operative cattle feed
    type: downcycle
    engine_channel_type: animal_feed
    horizon: RECOVER
    basis: cost
    recovery_factor: 0.03
    lead_time_hours: 12.0
    min_residual_life_hours: 0
    min_qty_kg: 1000
    max_qty_kg: null
    allowed_grades: [B, C, reject]
    available_days: [mon, wed, fri]
    cutoff_hour: 12
    co2e_avoided_factor: 0.6

  - id: farm_compost_return
    name: Return to field as compost
    type: downcycle
    engine_channel_type: compost
    horizon: RECOVER
    basis: cost
    recovery_factor: 0.01 # nutrient value back to the plot, less the haulage
    lead_time_hours: 4.0
    min_residual_life_hours: 0
    min_qty_kg: 0
    max_qty_kg: null
    allowed_grades: [A, B_plus, B, C, reject]
    available_days: [mon, tue, wed, thu, fri, sat, sun]
    cutoff_hour: 24
    co2e_avoided_factor: 0.35
    notes: Recovers almost no money and still beats abandoning the lot at the mandi gate.

  - id: abandon_at_mandi
    name: Abandon the lot
    type: baseline
    engine_channel_type: compost
    horizon: RECOVER
    basis: cost
    recovery_factor: 0.0
    lead_time_hours: 0
    min_residual_life_hours: 0
    min_qty_kg: 0
    max_qty_kg: null
    allowed_grades: [A, B_plus, B, C, reject]
    available_days: [mon, tue, wed, thu, fri, sat, sun]
    cutoff_hour: 24
    co2e_avoided_factor: 0.0
    is_baseline: true
    notes: >
      Not a rhetorical option. Tomato is dumped at mandi gates in this country every
      season when the realised price will not cover the freight already spent. It is the
      counterfactual every figure above is measured against, it is always eligible, it is
      always ranked last, and it is never hidden.
