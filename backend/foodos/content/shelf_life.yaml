# Storage zones the demo dataset uses. Person A plants the temperature excursion in COLD_2.
storage_zones:
  DRY_1:
    name: Dry store
    set_temp_c: 25.0
    typical_temp_c: 27.5
  COLD_1:
    name: Walk-in chiller
    set_temp_c: 4.0
    typical_temp_c: 4.6
  COLD_2:
    name: Under-counter chiller (prep line)
    set_temp_c: 4.0
    typical_temp_c: 9.2
    notes: Door opened constantly during service. This is the planted pathology-two zone.
  MEAT_1:
    name: Meat chiller
    set_temp_c: 2.0
    typical_temp_c: 2.4
  FREEZER_1:
    name: Freezer
    set_temp_c: -18.0
    typical_temp_c: -17.1
